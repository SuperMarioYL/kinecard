name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack npm tarball into dist/
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ( cd dist && sha256sum *.tgz > checksums.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/*

  # Opt-in publish to npm. A fresh repo has no NPM_TOKEN / registered package, so
  # this stays skipped until you set the NPM_PUBLISH repo variable to 'true' and
  # add an NPM_TOKEN secret. Keeps the first release green.
  publish-npm:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
