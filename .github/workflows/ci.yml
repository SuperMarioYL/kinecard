name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      # The browser-backed e2e render tests self-skip on CI (headless software-GL
      # screenshots hang there); this job runs the pure-logic unit suite. Run the
      # full render suite locally, or in a GPU-backed box with KINECARD_E2E=1.
      - name: Test (unit)
        run: npm test
