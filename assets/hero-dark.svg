<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="KineCard — HTML to video for vertical knowledge cards">
  <defs>
    <linearGradient id="hg" x1="-220%" y1="0%" x2="-100%" y2="0%">
      <stop offset="0%" stop-color="#8985FF"/>
      <stop offset="50%" stop-color="#FF6482"/>
      <stop offset="100%" stop-color="#8985FF"/>
      <animate attributeName="x1" values="-220%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100%;220%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#1D1D1F"/>

  <g transform="translate(96 66)" opacity="0.9">
    <rect x="0" y="0" width="96" height="168" rx="14" fill="none" stroke="#3A3A44" stroke-width="2"/>
    <rect x="16" y="26" width="64" height="10" rx="3" fill="#8985FF" opacity="0.85">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" begin="0s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="52" width="48" height="8" rx="3" fill="#F5F5F7" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.6s" begin="-0.5s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="70" width="56" height="8" rx="3" fill="#F5F5F7" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.6s" begin="-1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="88" width="40" height="8" rx="3" fill="#FF6482" opacity="0.7">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.6s" begin="-1.5s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="470" y="140" text-anchor="middle" font-size="64" font-weight="700" fill="url(#hg)">KineCard</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.4s" dur="0.8s" fill="freeze"/>
    <text x="470" y="184" text-anchor="middle" font-size="19" font-weight="500" fill="#A1A1A8">HTML → video, for vertical knowledge cards</text>
  </g>

  <circle cx="470" cy="222" r="3" fill="#FF6482">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
</svg>
