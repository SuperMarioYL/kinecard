<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="流水线：card.yaml + 模板 → 帧引擎(Chromium seek) → ffmpeg 编码 → 9:16 MP4 + 可编辑项目，含改一行重渲单卡的回环">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="182" y1="180" x2="247" y2="180" marker-end="url(#ah-l)"/>
    <line x1="407" y1="180" x2="472" y2="180" marker-end="url(#ah-l)"/>
    <line x1="632" y1="180" x2="697" y2="180" marker-end="url(#ah-l)"/>
  </g>

  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="182" y1="180" x2="243" y2="180" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="407" y1="180" x2="468" y2="180" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="632" y1="180" x2="693" y2="180" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M182,180 L247,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M407,180 L472,180" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M632,180 L697,180" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M777,224 C 620,320 260,320 102,224" fill="none" stroke="#C9C9D0" stroke-width="1.5" marker-end="url(#ah-l)"/>
  <path d="M777,224 C 620,320 260,320 102,224" fill="none" stroke="#FF375F" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 10" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.9s" repeatCount="indefinite"/>
  </path>
  <text x="440" y="316" text-anchor="middle" font-size="12.5" font-weight="500" fill="#FF375F">改一行文字 → 重渲单卡</text>

  <g>
    <rect x="22" y="138" width="160" height="84" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="102" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0A4F9E">输入</text>
    <text x="102" y="196" text-anchor="middle" font-size="13" font-weight="500" fill="#1D1D1F">card.yaml + 模板</text>

    <rect x="247" y="138" width="160" height="84" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="327" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#4B3FC4">帧引擎</text>
    <text x="327" y="196" text-anchor="middle" font-size="13" font-weight="500" fill="#1D1D1F">Chromium · seek(t)</text>

    <rect x="472" y="138" width="160" height="84" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="552" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0B6B53">编码</text>
    <text x="552" y="196" text-anchor="middle" font-size="13" font-weight="500" fill="#1D1D1F">ffmpeg → H.264</text>

    <rect x="697" y="138" width="160" height="84" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="777" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0A4F9E">输出</text>
    <text x="777" y="196" text-anchor="middle" font-size="13" font-weight="500" fill="#1D1D1F">9:16 MP4 + 项目</text>
  </g>

  <text x="440" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#6E6E73">确定性 HTML/CSS → 9:16 MP4 · 单 Node 进程，无云端</text>
</svg>
